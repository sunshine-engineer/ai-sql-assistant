# File: deployment/secrets.example.toml
# Purpose: Provide placeholder hosted identity, provider, and database grants without secrets.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23

# Copy to .streamlit/secrets.toml (ignored), replace all placeholders.
# Use only in ASSISTANT_DEPLOYMENT=hosted, behind HTTPS.
[auth]
redirect_uri = "https://your-host.example/oauth2callback"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET"
client_id = "REPLACE_WITH_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
server_metadata_url = "https://issuer.example/.well-known/openid-configuration"

[provider]
api_key = "CONFIGURE_LOCALLY"
model = "qwen/qwen3.8-27b"

[database_access."analyst@example.test"]
kind = "postgres"
schema = "reporting"
provider_approved = true # operator must approve reviewed, de-identified views

[database_access."analyst@example.test".columns]
approved_sales = ["month", "net_revenue_cents"]

[database_access."analyst@example.test".connection]
host = "db.example.test"
port = 5432
user = "analyst_readonly"
password = "CONFIGURE_LOCALLY"
database = "analytics"
tls_ca = "/run/trusted-ca/root.crt"
