services:
  reviewer:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      ASSISTANT_DEPLOYMENT: reviewer
      ASSISTANT_TELEMETRY_PATH: /app/.telemetry/requests.db
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /app/data:uid=10001,gid=10001,mode=0700,size=32m
      - /app/.telemetry:uid=10001,gid=10001,mode=0700,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
