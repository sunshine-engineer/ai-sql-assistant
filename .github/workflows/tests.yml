# File: .github/workflows/tests.yml
# Purpose: Validate formatting, offline behavior, remote database controls, and container startup.
# Maintainer: sunshine-engineer
# Modified: 2026-10-23

name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m scripts.check_consistency
      - run: python -m pytest -q
      - run: python -m assistant.evaluation --output evaluation/results/reference.json
      - run: python -m assistant.instance_checks --output evaluation/results/instance-checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: retail-reference-evaluation
          path: evaluation/results/*.json
  remote-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-admin
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-admin
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pdisposable-admin"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:disposable-admin@127.0.0.1:5432/testdb
      TEST_MYSQL_ADMIN_URL: mysql+mysqlconnector://root:disposable-admin@127.0.0.1:3306/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_integration.py

  reviewer-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:8501/_stcore/health
      - if: always()
        run: docker compose down
